<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SimpleNotes</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  </head>
  <body>
    <aside id="sidebar">
      <div class="brand">📝 SimpleNotes</div>
      <div class="sidebar-actions">
        <button id="new-btn" class="primary">+ New note</button>
        <a id="stats-link" class="button" href="#/stats">📊 Stats</a>
      </div>
      <input id="search" type="search" placeholder="Search… (press / to focus)" />
      <div id="tags"></div>
      <ul id="note-list"></ul>
    </aside>

    <main id="main">
      <div id="empty" class="empty">Select a note on the left, or create a new one.</div>

      <section id="viewer" hidden>
        <div class="toolbar">
          <h1 id="view-title"></h1>
          <div>
            <button id="edit-btn">Edit</button>
            <button id="delete-btn" class="danger">Delete</button>
          </div>
        </div>
        <div id="view-meta" class="meta"></div>
        <article id="view-body" class="markdown"></article>
      </section>

      <section id="editor" hidden>
        <div class="toolbar">
          <input id="edit-title" placeholder="Title" />
          <div>
            <button id="save-btn" class="primary">Save</button>
            <button id="cancel-btn">Cancel</button>
          </div>
        </div>
        <div class="edit-panes">
          <textarea
            id="edit-content"
            placeholder="Write in Markdown… Use #tag to add tags, and [[Note Title]] to link to another note"
          ></textarea>
          <article id="edit-preview" class="markdown"></article>
        </div>
      </section>
      <section id="stats" hidden>
        <div class="toolbar">
          <h1>Note Analytics</h1>
          <div>
            <button id="save-report-btn" class="primary">Save Report</button>
          </div>
        </div>
        <div id="stats-meta" class="meta"></div>

        <div id="stat-cards" class="stat-cards"></div>

        <h2>Activity <small>notes by last-modified date, last 14 days</small></h2>
        <div id="activity-chart" class="activity"></div>

        <div class="stats-grid">
          <div>
            <h2>Top tags</h2>
            <ol id="top-tags" class="rank-list"></ol>
          </div>
          <div>
            <h2>Top words</h2>
            <ol id="top-words" class="rank-list"></ol>
          </div>
        </div>

        <h2>Notes by length</h2>
        <table class="stats-table">
          <thead>
            <tr><th>Note</th><th class="num">Words</th><th class="num">Reading time</th></tr>
          </thead>
          <tbody id="notes-table"></tbody>
        </table>

        <h2>Previous Reports</h2>
        <div id="reports-box" class="reports-box"></div>
      </section>
    </main>

    <dialog id="report-dialog">
      <div class="toolbar">
        <strong id="report-dialog-title"></strong>
        <div><button id="report-close-btn">Close</button></div>
      </div>
      <article id="report-body" class="markdown"></article>
    </dialog>

    <div id="toast" hidden></div>
    <script src="/static/app.js"></script>
  </body>
</html>
